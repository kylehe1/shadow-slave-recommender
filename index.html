<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="style.css">
    <title>Shadow Slave Recommender</title>
  </head>
  <body>
    <h1>Find Your Next Light Novel</h1>
    <p>Tell us which volumes you loved in Shadow Slave — and we'll find your next read.</p>
    <div class="arc-selector">
      <h2>Which volumes did you love?</h2>
      <div class="arcs">
        <button class="arc-btn">Vol 1: Child of Shadows</button>
        <button class="arc-btn">Vol 2: Demon of Change</button>
        <button class="arc-btn">Vol 3: Prince of Nothing</button>
        <button class="arc-btn">Vol 4: Chain Breaker</button>
        <button class="arc-btn">Vol 5: Dread Night</button>
        <button class="arc-btn">Vol 6: All the Devils Are Here</button>
        <button class="arc-btn">Vol 7: The Tomb of Ariel</button>
        <button class="arc-btn">Vol 8: Lord of Shadows</button>
        <button class="arc-btn">Vol 9: Throne of War</button>
        <button class="arc-btn">Vol 10: Dark Lord's Dreadful Travelogue</button>
        <button class="arc-btn">Vol 11</button>
        <button class="arc-btn">Vol 12</button>
      </div>
      <button class="submit-btn">Find My Next Read →</button>
    </div>
  </body>
</html>
